# Removes UI components from MuMuNxMain.exe entirely, rather than hiding them.
#
# Every site here was located in a live x64dbg session (see
# doc/analysis/debugging.md) and cross-checked against the static image.  The
# method:
#
#   * break on the *body* of Qt5Core's setObjectName, with a condition that
#     keeps only callers inside mumunxmain.exe, and redirect the log to a file;
#   * read the widget name that follows each construction, which identifies the
#     widget without guesswork.
#
# How each site is located
# ------------------------
# The MSVC compiler emits the *same* instruction sequence for adjacent widgets
# in a title-bar builder, so two sites can be byte-identical apart from the
# displacement of one indirect call.  No byte signature can separate them on its
# own.
#
# The discriminator is the widget's own object-name literal, which each block
# assigns via `setObjectName` a short distance before the layout call.  Every
# entry below therefore carries a `locate` of kind `string-ref` naming that
# literal ("mainFaqMenuItem", "leftMuMuRemoteBtn", ...), and the signature is
# used to *verify* the site the locator found rather than to find it.
#
# The rule is a conjunction, and that is what makes it work: the patch resolves
# only if exactly one (reference, site) pair exists.  Several of these literals
# are referenced from more than one place -- "avatarButton" from six -- but only
# one reference of each has the patch's signature within its window.
#
# This replaced `locate_rva` (an absolute address).  The address was
# unambiguous but was invalidated by any rebuild; the object name is not.  See
# `tests/test_robustness.py`, which measures the difference: a 0x40-byte shift
# of the image broke 9 of these 9 before, and breaks none now.
#
# Why the replacement is NOPs
# ---------------------------
# The surrounding code assumes the widget exists: `setObjectName` dereferences
# `this` immediately (`mov rbx, [rcx+8]` with no null check), and two
# `QObject::connect` calls wire up its click handlers straight afterwards.
# Making the *construction* fail would therefore crash, and so would nulling
# the pointer.  Replacing the layout insertion instead leaves the widget fully
# constructed, named and connected, but never added to any layout -- so it is
# never laid out, never painted, and takes no space.  Same-length, so nothing
# relocates.

[profile]
name = "remove-components"
description = "Remove MuMu launcher UI components: the account avatar button and five title-bar dropdown menu items (消息中心, 兑换中心, 常见问题, 下载掌上MuMu)"
# Required, not optional: patching MuMuNxMain.exe strips its Authenticode blob,
# which arms the self-integrity check that spawns CPU-burning threads.  The
# dependency is declared here so it cannot be forgotten at the command line.
requires = ["no-integrity-punish"]
# Vendor build these offsets were authored against (see pe/buildid.py).
# Diagnostic only: a mismatch warns and never blocks.  Regenerate with
# `mumu-patch rebase` after a MuMu update.
build = "8b142aee08fad65f"

# -- Account avatar button (the boxed circle, top right) ---------------------
#
# Live-session trace of the construction:
#
#   call NX::NxPushButton2::NxPushButton2(WidgetData, QWidget*)   @0x14ae3e
#   lea  "avatarButton"                                           @0x14ae5c
#   QString::fromAscii_helper                                     @0x14ae63
#   QObject::setObjectName("avatarButton")                        @0x14ae76
#   QObject::connectImpl  x2   (click handlers)                   @0x14af0c / @0x14afa1
#   QBoxLayout::addWidget                                         @0x14afc1   <-- removed
#
# The `lea` at 0x14ae5c is also one of the six references to the name, where it
# reads as a findChild lookup.  The constructor call sits 9 bytes before it,
# which is why scanning only the `lea` neighbourhood gives the wrong answer.
# The `locate` window is centred on the `lea "avatarButton"` at 0x14ae5c, which
# is what the locator anchors on.  The signature itself begins 15 bytes before
# the `call` being replaced, at the `mov r9d, 0x84` that opens the same inline
# addWidget sequence -- so the window has to be wide enough to span the distance
# between the two (0x156 bytes, hence window = 0x200).
# The whole 6-byte indirect call is wildcarded, not just its displacement:
# `replace` overwrites all six bytes with NOPs, so a signature that pinned
# `FF 15` would stop matching once applied and the patch would become
# undetectable.  Everything the patch does not touch stays literal.
[[patch]]
id = "avatar-button"
description = "Stop the account avatar button from being added to the title bar"
file = "nx_main/MuMuNxMain.exe"
locate = { kind = "string-ref", value = "avatarButton", window = 0x200 }
signature = "41 B9 84 00 00 00 45 33 C0 48 8B D3 48 8B CE ?? ?? ?? ?? ?? ?? 90 48 8D 4D 10 E8"
expect = "41 B9 84 00 00 00 45 33 C0 48 8B D3 48 8B CE FF 15 09 45 AE 01 90 48 8D 4D 10 E8"
replace = "41 B9 84 00 00 00 45 33 C0 48 8B D3 48 8B CE 90 90 90 90 90 90 90 48 8D 4D 10 E8"
known_rvas = ["0x14afb2"]


# ===========================================================================
# Title-bar dropdown menu items  (see doc/analysis/components.md)
# ===========================================================================
#
# The dropdown is a native QMenu named "MainMenu" (0x168121), built by one
# function spanning RVA 0x16803e-0x16939c.  Each item is a self-contained
# block ending in a call to a factory that allocates the item and attaches it:
#
#   call QMetaObject::tr                  ; the visible Chinese label
#   ...  4 icon records {index, white svg, black svg} ...
#   call 0xbd43                           ; copy those records into a container
#   lea  rdx, <name literal>              ; e.g. "mainMessageCenterMenuItem"
#   call QString::operator=(const char*)
#   ...  feature-flag test via a `mov al,1; ret` stub ...
#   lea  r8,[rbp+Y] ; lea rdx,[rbp+Z] ; mov rcx,rdi
#   call <factory>                        ; <-- creates the item; NOPed below
#
# Two sibling factories do the work, and they are the only place a menu item
# object comes into existence:
#
#   0x462310  via thunk 0x1ec3b  allocates 0xC8  -> 消息中心 only
#   0x461c80  via thunk 0x2c5c   allocates 0xC8  -> the other five
#
# NOPing the *call site* means the item is never created, so it is genuinely
# absent from the menu rather than present-but-blank.
#
# Why NOT the `call 0xbd43`
# -------------------------
# Patching `call 0xbd43` does not work, and the reason is worth recording: it
# looks like the call that appends the item to the menu, and a live run confirms
# the menu is completely unchanged by patching it.  Resolving the thunk shows
# why -- 0x13229a0 is a container range-fill loop:
#
#   imul rdi, r8 ; add rdi, rcx ; ... loop: call rdx ; dec rbx
#
# i.e. `std::vector`/`QList`-style bulk insertion, with edx=0x18 (24-byte
# elements) and r8d=4 (four of them) matching the four icon records above it.
# It touches no widget and no QMenu, so patching it has no visible effect.
#
# Why this is safe
# ----------------
# The factory's return value is discarded: the instruction right after every
# call is `mov rcx,[rbp+...]`, which overwrites rax, and the following code is
# null-guarded (`test rcx,rcx` / `je`).  Nothing consumes the result, so
# skipping the call cannot leave a dangling pointer or garbage handle.  The
# replacement is the same length (5 bytes), so nothing relocates.
#
# Why a plain signature is not enough
# -----------------------------------
# The redemption, setting, FAQ and about call sites are byte-identical across
# the whole 16-byte window:
#
#   48 8D 55 20 48 8B CF E8 ?? ?? ?? ?? 90 48 8B 8D
#
# so a bare scan returns four matches and this project treats ambiguity as
# fatal.  What separates them is the object name each block assigns a short way
# earlier -- "mainMessageCenterMenuItem", "mainRedemptionCenterMenuItem",
# "mainFaqMenuItem", "mainDownloadAppMenuItem" -- so each patch carries a
# `locate` of kind `string-ref` on its own name and the signature verifies the
# result.  Every one of those literals is unique in the image, and each sits
# exactly 0x50 bytes before its call site, which is why window = 0x100 is
# comfortable.
#
# Each signature starts 7 bytes before the call, at `lea rdx,[rbp+..]`, and
# wildcards the 5-byte call (bytes 7..11) because `replace` overwrites exactly
# those -- pinning them would make the patch undetectable once applied, which
# `Patch.validate()` rejects per byte at load time.
#
# 关于 MuMu and 设置中心 are deliberately absent: both are kept, so no patch is
# written for their create calls (0x169313 and 0x168a6f).

# -- 消息中心 (Message Center) ----------------------------------------------
#   create call at 0x16842b -> factory 0x462310 (via thunk 0x1ec3b)
[[patch]]
id = "menu-message-center"
description = "Remove the 消息中心 item from the title-bar dropdown menu"
file = "nx_main/MuMuNxMain.exe"
locate = { kind = "string-ref", value = "mainMessageCenterMenuItem", window = 0x100 }
signature = "48 8D 55 90 48 8B CF ?? ?? ?? ?? ?? 90 48 8B 8D"
expect = "48 8D 55 90 48 8B CF E8 0B 68 EB FF 90 48 8B 8D"
replace = "48 8D 55 90 48 8B CF 90 90 90 90 90 90 48 8B 8D"
known_rvas = ["0x168424"]

# -- 兑换中心 (Redemption Center) -------------------------------------------
#   create call at 0x168778 -> factory 0x461c80 (via thunk 0x2c5c)
# This is the *dropdown's* 兑换中心 (`mainRedemptionCenterMenuItem`).  The tray
# has a separate entry with its own identifier in a different function; see the
# note at the end of this file.
[[patch]]
id = "menu-redemption-center"
description = "Remove the 兑换中心 item from the title-bar dropdown menu"
file = "nx_main/MuMuNxMain.exe"
locate = { kind = "string-ref", value = "mainRedemptionCenterMenuItem", window = 0x100 }
signature = "48 8D 55 20 48 8B CF ?? ?? ?? ?? ?? 90 48 8B 8D"
expect = "48 8D 55 20 48 8B CF E8 DF A4 E9 FF 90 48 8B 8D"
replace = "48 8D 55 20 48 8B CF 90 90 90 90 90 90 48 8B 8D"
known_rvas = ["0x168771"]

