# ===========================================================================
# Left navigation rail  (see doc/analysis/components.md)
# ===========================================================================
#
# The rail is built by one function spanning RVA 0x146b80-0x147900.  Each
# button is created, named with setObjectName, added to a QButtonGroup
# (QButtonGroup::addButton, 4 calls) and then inserted into the rail's
# QBoxLayout with QBoxLayout::addWidget (5 calls).  The five addWidget sites:
#
#   0x146c38  leftDeviceBtn       设备     KEPT (no patch)
#   0x146f79  leftMuMuRemoteBtn   远控     removed
#   0x147200  leftLobsterBtn      (not in the screenshot)  left alone
#   0x14749b  leftCloudPhoneBtn   云手机   removed
#   0x1477aa  feedbackBtn         反馈     removed
#
# Note the build order is not the on-screen order: leftLobsterBtn is
# constructed before leftCloudPhoneBtn.
#
# NOPing the addWidget call leaves the button fully constructed, named,
# connected and still a member of the button group -- it is simply never laid
# out, so it is not painted and takes no space.  This is the same technique
# already proven by `avatar-button`, and it is the safe choice here for the
# same reason: the surrounding code assumes the widget exists (setObjectName
# runs on it and QButtonGroup::addButton registers it).
#
# Note the guards inside this function are *styling* branches, not visibility:
# the test at 0x146c51-0x146c69 chooses between the normal and clawbox icon
# sets for the same button, and both branches converge on the same addWidget.
# Patching a guard would therefore change the icon theme, not remove anything.
#
# Why a plain signature is not enough
# -----------------------------------
# All five addWidget sites compile to the same 12-byte prologue:
#
#   45 8B CD 45 33 C0 48 8B D3 48 8B CE FF 15
#
# so the patched sites (`leftMuMuRemoteBtn`, `leftCloudPhoneBtn`,
# `feedbackBtn`) each match **seven** places in the image; `leftDeviceBtn`
# matches two, and is the one that must stay unpatched.  The object-name
# literal each block assigns identifies it: "leftMuMuRemoteBtn" at 0xcb before
# its site, "leftCloudPhoneBtn" at 0x34, "feedbackBtn" at 0x34.  A `locate` of
# kind `string-ref` on that name, plus the signature as verification, resolves
# each to exactly one site.
#
# The call being NOPed is an indirect `call [rip+disp]` (FF 15 disp32), i.e.
# six bytes, wildcarded in the signature because `replace` overwrites exactly
# those.  Each signature is 18 bytes: the 12-byte prologue plus the call.

# -- 设备 (Device): KEPT ------------------------------------------------------
#   addWidget at 0x146c38, prologue 0x146c2c
# 设备 is the device-list page and is deliberately retained, so no patch is
# written for its addWidget.  Its site is recorded here only so a future edit
# knows which address must stay untouched -- `nav-keep-device` in the tests
# asserts that no patch ever claims 0x146c2c.

# -- 远控 (Remote control) ---------------------------------------------------
#   addWidget at 0x146f79, prologue anchored at 0x146f6d
[[patch]]
id = "nav-remote"
description = "Remove the 远控 button from the left navigation rail"
file = "nx_main/MuMuNxMain.exe"
locate = { kind = "string-ref", value = "leftMuMuRemoteBtn", window = 0x100 }
signature = "45 8B CD 45 33 C0 48 8B D3 48 8B CE ?? ?? ?? ?? ?? ??"
expect = "45 8B CD 45 33 C0 48 8B D3 48 8B CE FF 15 51 85 AE 01"
replace = "45 8B CD 45 33 C0 48 8B D3 48 8B CE 90 90 90 90 90 90"
known_rvas = ["0x146f6d"]

# -- 云手机 (Cloud phone) ----------------------------------------------------
#   addWidget at 0x14749b, prologue anchored at 0x14748f
#
# Careful: the build order in this function is NOT the on-screen order.
# leftLobsterBtn is constructed *before* leftCloudPhoneBtn, so the addWidget at
# 0x147200 belongs to the lobster button (not in the screenshot, deliberately
# left alone) and the cloud-phone one is at 0x14749b.  The mapping was
# confirmed by scanning back from each addWidget to the nearest
# setObjectName-bearing name literal.
[[patch]]
id = "nav-cloudphone"
description = "Remove the 云手机 button from the left navigation rail"
file = "nx_main/MuMuNxMain.exe"
locate = { kind = "string-ref", value = "leftCloudPhoneBtn", window = 0x100 }
signature = "45 8B CD 45 33 C0 48 8B D3 48 8B CE ?? ?? ?? ?? ?? ??"
expect = "45 8B CD 45 33 C0 48 8B D3 48 8B CE FF 15 2F 80 AE 01"
replace = "45 8B CD 45 33 C0 48 8B D3 48 8B CE 90 90 90 90 90 90"
known_rvas = ["0x14748f"]

# -- 反馈 (Feedback) ---------------------------------------------------------
#   addWidget at 0x1477aa, prologue anchored at 0x14779e
# Note this item is not added to the button group (it is a plain button), so
# there is no addButton call for it -- the addWidget is the only site.
[[patch]]
id = "nav-feedback"
description = "Remove the 反馈 button from the bottom of the left navigation rail"
file = "nx_main/MuMuNxMain.exe"
locate = { kind = "string-ref", value = "feedbackBtn", window = 0x100 }
signature = "45 8B CD 45 33 C0 48 8B D3 48 8B CE ?? ?? ?? ?? ?? ??"
expect = "45 8B CD 45 33 C0 48 8B D3 48 8B CE FF 15 20 7D AE 01"
replace = "45 8B CD 45 33 C0 48 8B D3 48 8B CE 90 90 90 90 90 90"
known_rvas = ["0x14779e"]

# ===========================================================================
# System tray: 兑换中心  (see doc/analysis/components.md)
# ===========================================================================
#
# Unlike the title-bar dropdown, the tray's 兑换中心 has a real skip guard
# already compiled into the binary, so no new control flow is needed.
#
# The tray is built in RVA 0x10d0e0-0x10dda9.  The top-level 兑换中心 entry is
# the block at 0x10d8e7-0x10db63, whose label comes from
# `tr("RedemptionCenter")` at 0x10d933.  It is guarded twice:
#
#   0x10d8e7  mov  rax, [rdi]           ; the tray object
#   0x10d8ea  mov  rcx, [rax+0x160]
#   0x10d8f1  test rcx, rcx
#   0x10d8f4  je   0x10dbfc             ; <-- patched to an unconditional jmp
#   0x10d8fa  mov  edx, 0x54
#   0x10d8ff  call 0x37a1               ; a pure predicate (reads [rcx+0xa8])
#   0x10d904  test al, al
#   0x10d906  je   0x10dbfc             ; already skips when the predicate is false
#
# Both exits land on 0x10dbfc, which is where the *next* tray entry begins, so
# jumping there skips exactly this entry and nothing else.  Turning the first
# `je` into an unconditional `jmp` therefore removes the entry by taking a path
# the binary already contains.
#
# Why not NOP something inside the block
# --------------------------------------
# The block's only REL calls are the container fill (`call 0xbd43` at 0x10db08)
# and a widget-data helper (`call 0xb82f` at 0x10daac) -- the same pair the
# title-bar dropdown uses, where patching the fill was proven to have no visible
# effect.  The guard is the reliable lever here because it is a real control-flow
# branch that already surrounds the whole entry.
#
# This is *not* the same as the submenu flyout: the block at 0x10db63
# (`trayRedemptionCenterMenuItem`) builds the popup's child actions into the
# submenu at [obj+0x4f8] and then calls QMenu::exec at 0x10dd3b.  Skipping the
# top-level entry means that flyout is never reachable, so no separate patch for
# it is required.
#
# The 5-byte `jmp rel32` plus one NOP keeps the replacement the same length as
# the original 6-byte `je rel32`, so nothing relocates.  The wildcarded bytes in
# the signature are exactly the six that `replace` overwrites.
[[patch]]
id = "tray-redemption-center"
description = "Remove the 兑换中心 entry from the system-tray menu"
file = "nx_main/MuMuNxMain.exe"
locate = { kind = "string-ref", value = "trayExitPlayerMenuItem", window = 0x100 }
signature = "48 8B 07 48 8B 88 60 01 00 00 48 85 C9 ?? ?? ?? ?? ?? ?? BA 54 00 00 00 E8 9D 5E EF FF 84 C0 0F 84 F0 02 00 00 C6"
expect = "48 8B 07 48 8B 88 60 01 00 00 48 85 C9 0F 84 02 03 00 00 BA 54 00 00 00 E8 9D 5E EF FF 84 C0 0F 84 F0 02 00 00 C6"
replace = "48 8B 07 48 8B 88 60 01 00 00 48 85 C9 E9 03 03 00 00 90 BA 54 00 00 00 E8 9D 5E EF FF 84 C0 0F 84 F0 02 00 00 C6"
known_rvas = ["0x10d8e7"]
